
<!DOCTYPE html>
<html>
<head>
  <title>Family Tree Explorer</title>
</head>
<body>

<div id="grandparent">
  <div id="parent">
    <p id="child">I am the child</p>
  </div>
</div>

<script>
  let child = document.getElementById("child");

  let parent = child.parentElement;
  console.log(parent.id);

  let grandparent = parent.parentElement;
  console.log(grandparent.id);

  parent.style.backgroundColor = "lightblue";

  grandparent.style.backgroundColor = "lightgreen";

  console.log(child.parentElement.parentElement.id);

  child.textContent = "I am inside the parent and grandparent containers";
</script>

</body>
</html>
